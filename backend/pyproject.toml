[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lettu_backend"
version = "0.1.0"
description = "FastAPI Backend for LettuVault - Handles Mobile and MQTT communication."
dependencies = [
    "fastapi==0.129.0",
    "uvicorn==0.40.0",
    "paho-mqtt==2.1.0",
    "python-multipart==0.0.22",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "pydantic-settings==2.0.3",
    "python-dotenv==1.0.0",
    "alembic==1.13.1",
    "sqlalchemy==2.0.36",
    "jinja2==3.1.6"
]

[tool.setuptools.packages.find]
where = ["src"]