<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LettuVault | Intelligence Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4ade80;
            --secondary: #60a5fa;
            --accent: #fbbf24;
            --danger: #f87171;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: var(--bg); color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0; padding: 2rem;
            display: flex; flex-direction: column; align-items: center;
        }

        .header { width: 100%; max-width: 1400px; display: flex; justify-content: space-between; margin-bottom: 2rem; }
        
        .dashboard-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 2rem; 
            width: 100%; 
            max-width: 1400px; 
        }

        .panel { 
            background: var(--card); border-radius: 24px; border: 1px solid var(--border); 
            overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex; flex-direction: column;
        }

        .panel-header { 
            padding: 1.25rem 1.5rem; 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .category-title { font-weight: 600; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
        
        .panel-content { height: 300px; overflow-y: auto; }

        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { 
            position: sticky; top: 0; background: var(--card); z-index: 10;
            padding: 0.75rem 1.5rem; text-align: left; color: var(--text-dim); 
            border-bottom: 2px solid var(--border); text-transform: uppercase; font-size: 0.65rem; 
        }
        td { padding: 0.85rem 1.5rem; border-bottom: 1px solid var(--border); }
        
        .timestamp { font-family: monospace; color: var(--text-dim); font-size: 0.75rem; }
        
        /* Specific Colors for Categories */
        .color-worms { color: var(--danger); }
        .color-lettuce { color: var(--primary); }
        .color-strawberry { color: #f472b6; } /* Pinkish */
        .color-wilting { color: var(--accent); }

        .badge { 
            padding: 4px 10px; border-radius: 6px; font-weight: 600; font-size: 0.75rem; 
            background: rgba(255, 255, 255, 0.05);
        }

        .refresh-btn { 
            background: var(--card); color: var(--text); border: 1px solid var(--border); 
            padding: 0.6rem 1.2rem; border-radius: 12px; cursor: pointer; font-weight: 600;
            transition: all 0.2s;
        }
        .refresh-btn:hover { background: var(--border); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1 style="margin:0;">LettuVault <span style="font-weight: 300; opacity: 0.7;">Intelligence Dashboards</span></h1>
            <p style="color: var(--text-dim); margin-top: 5px;">Specialized monitoring for each detection class</p>
        </div>
        <button class="refresh-btn" onclick="loadAllData()">🔄 Refresh All</button>
    </div>

    <div class="dashboard-grid">
        <!-- WORMS DASHBOARD -->
        <div class="panel">
            <div class="panel-header">
                <div class="category-title color-worms">🪱 Worms Detection</div>
            </div>
            <div class="panel-content">
                <table>
                    <thead><tr><th>Time</th><th>Count</th><th>Conf</th><th>Label</th></tr></thead>
                    <tbody id="worms-body"></tbody>
                </table>
            </div>
        </div>

        <!-- WILTING DASHBOARD -->
        <div class="panel">
            <div class="panel-header">
                <div class="category-title color-wilting">🍂 Wilting Analysis</div>
            </div>
            <div class="panel-content">
                <table>
                    <thead><tr><th>Time</th><th>Count</th><th>Conf</th><th>Label</th></tr></thead>
                    <tbody id="wilting-body"></tbody>
                </table>
            </div>
        </div>

        <!-- STRAWBERRY DASHBOARD -->
        <div class="panel">
            <div class="panel-header">
                <div class="category-title color-strawberry">🍓 Strawberry Monitor</div>
            </div>
            <div class="panel-content">
                <table>
                    <thead><tr><th>Time</th><th>Count</th><th>Conf</th><th>Label</th></tr></thead>
                    <tbody id="strawberry-body"></tbody>
                </table>
            </div>
        </div>

        <!-- LETTUCE DASHBOARD -->
        <div class="panel">
            <div class="panel-header">
                <div class="category-title color-lettuce">🥬 Lettuce Growth</div>
            </div>
            <div class="panel-content">
                <table>
                    <thead><tr><th>Time</th><th>Count</th><th>Conf</th><th>Label</th></tr></thead>
                    <tbody id="lettuce-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'lettuce-master-key-2024';

        async function loadAllData() {
            try {
                const res = await fetch('/api/v1/ai-scans', { headers: { 'X-API-KEY': API_KEY } });
                const scans = await res.json();
                
                // Clear all bodies
                ['worms', 'wilting', 'strawberry', 'lettuce'].forEach(id => {
                    document.getElementById(id + '-body').innerHTML = '';
                });

                scans.forEach(scan => {
                    const labelLower = (scan.label || "").toLowerCase();
                    
                    // Logic to figure out which table(s) this scan belongs to
                    if (labelLower.includes('worms')) addRow('worms', scan, 'worms');
                    if (labelLower.includes('wilting')) addRow('wilting', scan, 'wilting');
                    if (labelLower.includes('strawberry')) addRow('strawberry', scan, 'strawberry');
                    if (labelLower.includes('lettuce')) addRow('lettuce', scan, 'lettuce');
                });
            } catch (e) { console.error("Fetch error:", e); }
        }

        function addRow(tableId, s, keyword) {
            const body = document.getElementById(tableId + '-body');
            const tr = document.createElement('tr');
            
            // Extract the specific count for this keyword from the label string
            // Label format: "1 lettuce, 2 worms"
            let specificCount = "Detected";
            const parts = s.label.split(',');
            parts.forEach(p => {
                if (p.toLowerCase().includes(keyword)) {
                    specificCount = p.trim().split(' ')[0] + " " + keyword.charAt(0).toUpperCase() + keyword.slice(1);
                }
            });

            tr.innerHTML = `
                <td class="timestamp">${new Date(s.timestamp).toLocaleTimeString()}</td>
                <td><span class="badge">${specificCount}</span></td>
                <td>${Math.round(s.confidence_score * 100)}%</td>
                <td style="color: var(--text-dim); font-size: 10px;">${s.label}</td>
            `;
            body.appendChild(tr);
        }

        setInterval(loadAllData, 5000); // Live update every 5s
        loadAllData();
    </script>
</body>
</html>
