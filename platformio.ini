; --- PLATFORMIO CONFIGURATION IN PROJECT ROOT ---
; This allows you to build, upload, and manage your embedded project 
; directly from the root of your workspace without navigating into subfolders!

[platformio]
; Tell PlatformIO where to find the source and library files
src_dir = embedded/src/LettuVault/src
include_dir = embedded/src/LettuVault/include
lib_dir = embedded/src/LettuVault/lib
data_dir = embedded/src/LettuVault/data
test_dir = embedded/src/LettuVault/test

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
  adafruit/Adafruit BME280 Library@^2.2.4
  adafruit/Adafruit Unified Sensor@^1.1.14
  bblanchon/ArduinoJson@^7.0.4
  adafruit/Adafruit SSD1306@^2.5.9
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit BusIO@^1.15.0
  chris--a/Keypad@^3.1.1
