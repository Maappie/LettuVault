[platformio]
# This tells PlatformIO to look inside the 'embedded' folder for everything
src_dir = embedded/src
include_dir = embedded/include
test_dir = embedded/test
data_dir = embedded/data

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
