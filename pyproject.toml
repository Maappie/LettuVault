[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "lettuvault-workspace"
version = "0.1.0"

# 1. This tells Python WHICH packages to include
[tool.setuptools]
packages = ["lettu_vault_ai", "lettu_backend"]

# 3. Bundle non-Python files (templates, etc.) inside each package
[tool.setuptools.package-data]
"lettu_backend" = ["templates/*.html"]

# 2. This tells Python WHERE those packages live
[tool.setuptools.package-dir]
"lettu_vault_ai" = "ai_system/src/lettu_vault_ai"
"lettu_backend" = "backend/src/lettu_backend"

[project.scripts]
db-migrate = "lettu_backend.main:run_migration"
db-upgrade = "lettu_backend.main:run_upgrade"
db-history = "lettu_backend.main:run_history"
db-status = "lettu_backend.main:run_status"